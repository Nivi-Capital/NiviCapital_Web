
<div class="form-group">
  <div class="datepicker-header_">
    <div class="label datrpicker-label">{{label}}<span class="text-danger">*</span></div>
    <div class="selected-date">
      <!-- {{ selectedDate  }} -->
    </div>
  </div>

  <mat-form-field appearance="outline" class="w-100">
    <input 
      matInput
       [disabled]="disabled"
        [required]="required"
        (blur)="onTouched()"
      [matDatepicker]="picker"
      [(ngModel)]="selectedDate"
     
      placeholder="DD/MM/YYYY"
      [min]="minDate"
      [max]="maxDate"
      maxlength="10"
      (keypress)="allowOnlyDate($event)"
      (input)="onManualInput($event); "
      (dateChange)="onDateChange($event.value)"
    />

    <!-- <mat-datepicker-toggle matSuffix [for]="picker">
    
    </mat-datepicker-toggle> -->
<mat-datepicker-toggle matSuffix [for]="picker">
  <img matDatepickerToggleIcon src="assets/images/icons/calendar2.svg" alt="calendar">
</mat-datepicker-toggle>

    <mat-datepicker #picker (opened)="onPickerOpen()">
       
      <mat-datepicker-actions>
        <button mat-button matDatepickerCancel class="date-btn">Cancel</button>
        <button mat-raised-button matDatepickerApply class="date-btn date-btn-ok">Ok</button>
      </mat-datepicker-actions>
    </mat-datepicker>
  </mat-form-field>
</div>
